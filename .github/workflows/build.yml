name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: xcodebuild -project Dobi.xcodeproj -scheme Dobi -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Dobi.app Payload/
          zip -qry Dobi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Dobi-unsigned-IPA
          path: Dobi-unsigned.ipa
